name: Market price snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: market-price-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate collector syntax
        run: node --check scripts/market-snapshot.mjs

      - name: Read public market prices
        run: node scripts/market-snapshot.mjs

      - name: Commit verified snapshots
        shell: bash
        run: |
          if git diff --quiet -- src/data/market-history.json; then
            echo "No confident market change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/market-history.json
          git commit -m "data: refresh market price snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
